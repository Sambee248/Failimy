{% extends "base.html" %}
{% block title %}{% if member_id %}编辑成员{% else %}添加成员{% endif %} - 家族谱系管理系统{% endblock %}
{% block content %}
<div class="page-header">
    <a href="javascript:history.back()" class="text-decoration-none me-2"><i class="bi bi-arrow-left"></i></a>
    <h3>{% if member_id %}编辑成员{% else %}添加新成员{% endif %}</h3>
</div>

<div id="alert-container"></div>

<div class="card">
    <div class="card-body">
        <form id="member-form" onsubmit="handleSubmit(event)">
            <div class="row mb-3">
                <div class="col-6">
                    <label for="family_id" class="form-label">所属家族 <span style="color:var(--destructive)">*</span></label>
                    <select class="form-select" id="family_id" required {% if family_id %}disabled{% endif %}>
                        <option value="">请选择家族</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="name" class="form-label">姓名 <span style="color:var(--destructive)">*</span></label>
                    <input type="text" class="form-control" id="name" required placeholder="请输入姓名">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-4">
                    <label for="gender" class="form-label">性别 <span style="color:var(--destructive)">*</span></label>
                    <select class="form-select" id="gender" required>
                        <option value="M">男</option>
                        <option value="F">女</option>
                    </select>
                </div>
                <div class="col-4">
                    <label for="birth_date" class="form-label">出生日期</label>
                    <input type="date" class="form-control" id="birth_date">
                </div>
                <div class="col-4">
                    <label for="death_date" class="form-label">逝世日期</label>
                    <input type="date" class="form-control" id="death_date">
                </div>
            </div>

            <div class="mb-3">
                <label for="generation" class="form-label">世代</label>
                <input type="number" class="form-control" id="generation" value="1" min="1" style="max-width:150px;">
            </div>

            <div class="mb-4">
                <label for="biography" class="form-label">简介</label>
                <textarea class="form-control" id="biography" rows="3" placeholder="简要描述此人生平..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>{% if member_id %}保存修改{% else %}添加成员{% endif %}
                </button>
                <a href="javascript:history.back()" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>

<script>
const isEdit = {% if member_id %}true{% else %}false{% endif %};
const memberId = {% if member_id %}{{ member_id }}{% else %}null{% endif %};
const preselectedFamily = {% if family_id %}{{ family_id }}{% else %}null{% endif %};

async function loadFamilies() {
    try {
        const families = await apiGet('/families');
        const select = document.getElementById('family_id');
        families.forEach(f => {
            const option = document.createElement('option');
            option.value = f.family_id;
            option.textContent = f.family_name;
            if (preselectedFamily && f.family_id === preselectedFamily) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    } catch (err) {
        showAlert('加载家族列表失败: ' + err.message);
    }
}

async function loadMember() {
    if (!isEdit) return;
    try {
        const m = await apiGet('/members/' + memberId);
        document.getElementById('family_id').value = m.family_id;
        document.getElementById('name').value = m.name;
        document.getElementById('gender').value = m.gender;
        document.getElementById('birth_date').value = m.birth_date || '';
        document.getElementById('death_date').value = m.death_date || '';
        document.getElementById('generation').value = m.generation;
        document.getElementById('biography').value = m.biography || '';
    } catch (err) {
        showAlert('加载成员信息失败: ' + err.message);
    }
}

async function handleSubmit(e) {
    e.preventDefault();
    const familyId = document.getElementById('family_id').value;
    const name = document.getElementById('name').value.trim();
    const gender = document.getElementById('gender').value;
    const birthDate = document.getElementById('birth_date').value;
    const deathDate = document.getElementById('death_date').value;
    const generation = parseInt(document.getElementById('generation').value) || 1;
    const biography = document.getElementById('biography').value.trim();

    if (!familyId || !name) {
        showAlert('请填写必填字段');
        return;
    }

    const data = {
        name, gender,
        birth_date: birthDate || null,
        death_date: deathDate || null,
        generation, biography
    };

    try {
        if (isEdit) {
            await apiPut('/members/' + memberId, data);
            showAlert('保存成功', 'success');
        } else {
            const result = await apiPost('/members/families/' + familyId, data);
            showAlert('添加成功', 'success');
            setTimeout(() => {
                window.location.href = '/members/' + result.member_id;
            }, 500);
        }
    } catch (err) {
        showAlert('操作失败: ' + err.message);
    }
}

loadFamilies();
loadMember();
</script>
{% endblock %}
