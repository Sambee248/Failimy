{% extends "base.html" %}
{% block title %}我的家族 - 家族谱系管理系统{% endblock %}
{% block content %}
<div class="page-header">
    <h3><i class="bi bi-folder2 me-2"></i>我的家族</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createFamilyModal">
        <i class="bi bi-plus-lg me-1"></i>创建家族
    </button>
</div>

<div id="alert-container"></div>
<div id="family-cards" class="d-flex flex-col gap-3"></div>

<!-- Create Family Modal -->
<div class="modal fade" id="createFamilyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">创建新家族</h5><button type="button" class="btn-close" data-bs-dismiss="modal">&times;</button></div>
            <div class="modal-body">
                <div class="mb-3"><label for="family-name" class="form-label">家族名称 <span style="color:var(--destructive)">*</span></label><input type="text" class="form-control" id="family-name" placeholder="例如：张氏族谱"></div>
                <div class="mb-3"><label for="family-desc" class="form-label">描述</label><textarea class="form-control" id="family-desc" rows="3" placeholder="简要描述此家族..."></textarea></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" onclick="createFamily()">创建</button></div>
        </div>
    </div>
</div>

<!-- Edit Family Modal -->
<div class="modal fade" id="editFamilyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">编辑家族</h5><button type="button" class="btn-close" data-bs-dismiss="modal">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="edit-family-id">
                <div class="mb-3"><label for="edit-family-name" class="form-label">家族名称 <span style="color:var(--destructive)">*</span></label><input type="text" class="form-control" id="edit-family-name"></div>
                <div class="mb-3"><label for="edit-family-desc" class="form-label">描述</label><textarea class="form-control" id="edit-family-desc" rows="3"></textarea></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary" onclick="updateFamily()">保存</button></div>
        </div>
    </div>
</div>

<script>
function formatDate(iso) { if(!iso) return ''; var d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function loadFamilies() {
    try {
        var families = await apiGet('/families');
        var container = document.getElementById('family-cards');
        if (families.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="bi bi-folder2-open"></i></div><p class="empty-text">还没有创建任何家族</p><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createFamilyModal"><i class="bi bi-plus-lg me-1"></i>创建第一个家族</button></div>';
            return;
        }
        container.innerHTML = families.map(function(f) {
            return '<div class="chart-card">' +
                '<div class="chart-card-header">' +
                    '<span><i class="bi bi-tree-fill me-2" style="color:var(--success)"></i><a href="/families/'+f.family_id+'/members" style="font-weight:600;color:var(--foreground);font-size:1.05rem;">'+f.family_name+'</a></span>' +
                    '<span class="d-flex gap-2 items-center"><span class="text-sm text-muted">创建于 '+formatDate(f.created_at)+'</span>' +
                    '<button class="btn btn-outline-primary btn-sm btn-icon" onclick="event.stopPropagation();openEdit('+f.family_id+',\''+f.family_name.replace(/'/g,"\\'")+'\',\''+(f.description||'').replace(/'/g,"\\'")+'\')" title="编辑"><i class="bi bi-pencil"></i></button></span>' +
                '</div>' +
                '<div class="chart-card-body">' +
                    '<div class="d-flex items-center gap-4 mb-2"><span class="text-sm"><i class="bi bi-people-fill me-1" style="color:var(--success)"></i><b>'+f.member_count+'</b> 位成员</span></div>' +
                    '<p class="text-sm text-muted mb-0">'+(f.description||'暂无描述')+'</p>' +
                '</div>' +
                '<div class="card-footer">' +
                    '<div class="d-flex gap-2 flex-wrap">' +
                        '<a href="/families/'+f.family_id+'/members" class="btn btn-primary btn-sm"><i class="bi bi-people"></i> 成员管理</a>' +
                        '<a href="/families/'+f.family_id+'/tree" class="btn btn-outline-primary btn-sm"><i class="bi bi-diagram-2"></i> 族谱树</a>' +
                        '<a href="/families/'+f.family_id+'/stats" class="btn btn-outline-primary btn-sm"><i class="bi bi-bar-chart"></i> 统计报表</a>' +
                        '<a href="/api/families/'+f.family_id+'/export/csv?token='+getToken()+'" download="family_'+f.family_id+'_members.csv" class="btn btn-outline-primary btn-sm"><i class="bi bi-download"></i> CSV</a>' +
                        '<a href="/families/'+f.family_id+'/import" class="btn btn-outline-primary btn-sm"><i class="bi bi-upload"></i> 导入</a>' +
                        '<button class="btn btn-outline-danger btn-sm ms-auto" onclick="deleteFamily('+f.family_id+')"><i class="bi bi-trash"></i> 删除</button>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }).join('');
    } catch (err) { showAlert('加载失败: '+err.message); }
}

async function downloadCSV(familyId) {
    try {
        var resp = await fetch('/api/families/' + familyId + '/export/csv', {
            headers: {'Authorization': 'Bearer ' + getToken()}
        });
        if (!resp.ok) throw new Error('Download failed');
        var blob = await resp.blob();
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'family_' + familyId + '_members.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
    } catch (err) {
        showAlert('CSV导出失败: ' + err.message);
    }
}

function openEdit(id, name, desc) {
    document.getElementById('edit-family-id').value = id;
    document.getElementById('edit-family-name').value = name;
    document.getElementById('edit-family-desc').value = desc;
    new bootstrap.Modal(document.getElementById('editFamilyModal')).show();
}

async function updateFamily() {
    var id = document.getElementById('edit-family-id').value;
    var name = document.getElementById('edit-family-name').value.trim();
    var desc = document.getElementById('edit-family-desc').value.trim();
    if (!name) { showAlert('请输入家族名称'); return; }
    try {
        await apiPut('/families/'+id, {family_name:name, description:desc});
        var modal = bootstrap.Modal.getInstance(document.getElementById('editFamilyModal'));
        modal.hide();
        await loadFamilies();
        showAlert('更新成功', 'success');
    } catch (err) { showAlert('更新失败: '+err.message); }
}

async function createFamily() {
    var name = document.getElementById('family-name').value.trim();
    var desc = document.getElementById('family-desc').value.trim();
    if (!name) { showAlert('请输入家族名称'); return; }
    try {
        await apiPost('/families', {family_name:name, description:desc});
        document.getElementById('family-name').value = '';
        document.getElementById('family-desc').value = '';
        bootstrap.Modal.getInstance(document.getElementById('createFamilyModal')).hide();
        await loadFamilies();
    } catch (err) { showAlert('创建失败: '+err.message); }
}

async function deleteFamily(id) {
    if (!confirm('确定要删除这个家族及其所有成员数据吗？此操作不可撤销！')) return;
    try { await apiDelete('/families/'+id); loadFamilies(); }
    catch (err) { showAlert('删除失败: '+err.message); }
}

loadFamilies();
</script>
{% endblock %}
