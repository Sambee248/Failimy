<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}家族谱系管理系统{% endblock %}</title>
    <!-- Bootstrap JS only for grid + modal functionality; visual styles overridden by shadcn.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/shadcn.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- API utilities MUST load first - page scripts depend on them -->
    <script>
        const API_BASE = '/api';
        const TOKEN_KEY = 'genealogy_token';
        const USER_KEY = 'genealogy_user';

        function getToken() {
            return localStorage.getItem(TOKEN_KEY);
        }
        function setAuth(token, user) {
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(USER_KEY, JSON.stringify(user));
        }
        function clearAuth() {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(USER_KEY);
        }
        function getUser() {
            const u = localStorage.getItem(USER_KEY);
            return u ? JSON.parse(u) : null;
        }
        function logout() {
            clearAuth();
            window.location.href = '/login';
        }

        async function api(url, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? {'Authorization': 'Bearer ' + token} : {}),
                ...(options.headers || {})
            };
            const response = await fetch(API_BASE + url, { ...options, headers });
            if (response.status === 401) {
                clearAuth();
                window.location.href = '/login';
                throw new Error('Unauthorized');
            }
            return response;
        }
        async function apiGet(url) {
            const resp = await api(url);
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || 'Request failed');
            }
            return resp.json();
        }
        async function apiPost(url, data) {
            const resp = await api(url, { method: 'POST', body: JSON.stringify(data) });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || 'Request failed');
            }
            return resp.json();
        }
        async function apiPut(url, data) {
            const resp = await api(url, { method: 'PUT', body: JSON.stringify(data) });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || 'Request failed');
            }
            return resp.json();
        }
        async function apiDelete(url) {
            const resp = await api(url, { method: 'DELETE' });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || 'Request failed');
            }
            return resp.json();
        }

        function showAlert(message, type = 'danger') {
            const container = document.getElementById('alert-container');
            if (!container) return;
            const icons = { danger: 'bi-exclamation-triangle', success: 'bi-check-circle', warning: 'bi-exclamation-circle', info: 'bi-info-circle' };
            const icon = icons[type] || icons.danger;
            container.innerHTML = '<div class="alert alert-' + type + '"><i class="bi ' + icon + ' me-2"></i>' + message + '<button type="button" class="btn-close" onclick="this.parentElement.remove()">&times;</button></div>';
        }

        // Auth guard: redirect to login if no token on protected pages
        const _path = window.location.pathname;
        if (_path !== '/login' && _path !== '/register') {
            if (!getToken()) {
                window.location.href = '/login';
            }
        }
    </script>

    {% if hide_sidebar|default(false) %}
    <!-- Login/Register pages: no sidebar -->
    <main>
        {% block content_full %}{% endblock %}
    </main>
    {% else %}
    <!-- All other pages: sidebar layout -->
    <div id="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading">
                <div class="logo-icon"><i class="bi bi-tree-fill"></i></div>
                <span>家谱管理系统</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link">
                    <i class="bi bi-speedometer2"></i>仪表盘
                </a>
                <a href="/families" class="sidebar-link">
                    <i class="bi bi-folder2"></i>我的家族
                </a>
                <a href="/relation/path" class="sidebar-link">
                    <i class="bi bi-diagram-3"></i>血缘查询
                </a>
            </nav>
            <div style="margin-top: auto;">
                <div class="sidebar-divider"></div>
                <div class="sidebar-nav">
                    <a href="#" onclick="logout(); return false;" class="sidebar-link">
                        <i class="bi bi-box-arrow-right"></i>退出登录
                    </a>
                </div>
            </div>
        </aside>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="topnav">
                <button class="menu-toggle" id="menu-toggle">
                    <i class="bi bi-list"></i>
                </button>
                <span class="user-info" id="navbar-username"></span>
            </nav>
            <main class="main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar toggle
            const toggle = document.getElementById('menu-toggle');
            if (toggle) {
                toggle.addEventListener('click', function() {
                    document.getElementById('sidebar-wrapper').classList.toggle('toggled');
                });
            }
            // Show username
            const user = getUser();
            const usernameEl = document.getElementById('navbar-username');
            if (user && usernameEl) {
                usernameEl.textContent = user.username + (user.is_admin ? ' [管理员]' : '');
                if (user.is_admin) {
                    var nav = document.querySelector('.sidebar-nav');
                    var divider = document.createElement('div');
                    divider.className = 'sidebar-divider';
                    var link = document.createElement('a');
                    link.href = '/admin';
                    link.className = 'sidebar-link';
                    link.innerHTML = '<i class="bi bi-shield-lock"></i>管理员面板';
                    nav.appendChild(divider);
                    nav.appendChild(link);
                }
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
