{% extends "base.html" %}
{% block title %}登录 - 家族谱系管理系统{% endblock %}
{% block content_full %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-card-header">
            <div class="auth-icon">
                <i class="bi bi-tree-fill"></i>
            </div>
            <h2>欢迎回来</h2>
            <p>登录您的账户以继续管理家族谱系</p>
        </div>
        <div class="auth-card-body">
            <div id="alert-container"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="输入您的用户名" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="输入您的密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mb-3">登 录</button>
            </form>
        </div>
        <div class="auth-card-footer">
            还没有账户？<a href="/register">立即注册</a>
        </div>
    </div>
</div>
<script>
async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
        const resp = await fetch(API_BASE + '/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await resp.json();
        if (!resp.ok) {
            showAlert(data.error || 'Login failed');
            return;
        }
        setAuth(data.token, data.user);
        window.location.href = '/dashboard';
    } catch (err) {
        showAlert('Network error: ' + err.message);
    }
}
</script>
{% endblock %}
